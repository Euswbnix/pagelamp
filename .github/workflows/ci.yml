name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # aws-lc-sys (rustls backend) needs NASM on Windows; use its prebuilt objects instead.
  AWS_LC_SYS_PREBUILT_NASM: 1
  RUST_BACKTRACE: 1

jobs:
  # Rust core, sources, MCP server and CLI on every desktop OS we ship to.
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude pagelamp-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude pagelamp-desktop

  # Desktop app: frontend checks, then the Tauri crate (needs the built frontend and the sidecar).
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build frontend
        run: pnpm run build
      - name: Build CLI sidecar (if configured)
        run: pnpm run --if-present build:sidecar
      - name: Generated types match the Rust facade
        if: runner.os == 'Linux'
        run: |
          "$(ls src-tauri/binaries/pagelamp-* | head -n 1)" schema > "$RUNNER_TEMP/schema.json"
          pnpm run gen:types --from "$RUNNER_TEMP/schema.json"
          git diff --exit-code -- src/api/generated.ts
      - name: Clippy (desktop crate)
        run: cargo clippy -p pagelamp-desktop --all-targets -- -D warnings
      - name: Test (desktop crate)
        run: cargo test -p pagelamp-desktop

  # Dependency licences must stay compatible with Apache-2.0 (docs/ARCHITECTURE.md §7).
  licenses:
    name: Licences
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
