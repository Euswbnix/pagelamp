name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing PageLamp! **Never paste Canvas tokens, calendar-feed links, real course
        materials or classmates' names** — describe them or use made-up examples.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Desktop app
        - Command line (pagelamp)
        - My AI app with PageLamp (MCP)
        - Sync (course folder / calendar feed)
        - Sync (Canvas)
        - Other
    validations:
      required: true
  - type: input
    id: ai-app
    attributes:
      label: AI app (if relevant)
      placeholder: e.g. Claude Desktop 1.x, ChatGPT desktop (Work mode), Claude Code
  - type: input
    id: version
    attributes:
      label: PageLamp version and OS
      placeholder: e.g. PageLamp 0.1.0 (or 0.3.0-alpha.1) on macOS 27 (Apple silicon) — see Settings → About or `pagelamp --version`
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: |
        Desktop app: Settings → Help & feedback → Copy diagnostic report…, then paste it here.
        Command line: `pagelamp report --out pagelamp-report.md`, then drag the file into this box
        or paste its contents. Read it first — it's already redacted, but it's your data.
  - type: textarea
    id: logs
    attributes:
      label: Error messages or output
      description: Check that nothing personal or secret is included.
      render: text
