<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StudentOS Connector (spike)</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
  input[type=url], input[type=text] { width: 100%; padding: .45rem; font: inherit; box-sizing: border-box; }
  button { font: inherit; padding: .4rem .9rem; margin: .5rem .5rem 0 0; }
  pre { background: rgba(127,127,127,.12); padding: .75rem; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .note { font-size: .9em; opacity: .8; }
</style>
</head>
<body>
  <h1>StudentOS Connector <small>(spike)</small></h1>
  <p class="note">Read-only: this extension only sends GET requests to your Canvas and never submits, posts or edits anything.
    Data goes to the StudentOS desktop app on this computer via native messaging.</p>
  <label for="canvas-url">Your Canvas URL</label>
  <input id="canvas-url" type="text" placeholder="https://canvas.example.edu" autocomplete="off">
  <div>
    <button id="save">Allow &amp; save</button>
    <button id="sync">Sync now</button>
    <button id="status">Check desktop app</button>
  </div>
  <p><label><input id="auto" type="checkbox"> Sync when I visit Canvas (at most every 15 min)</label></p>
  <pre id="out">Not configured.</pre>
  <script src="lib/getonly.js"></script>
  <script src="lib/canvas-core.js"></script>
  <script src="options.js"></script>
</body>
</html>
