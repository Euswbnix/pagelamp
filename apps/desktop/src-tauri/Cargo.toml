[package]
name = "pagelamp-desktop"
description = "PageLamp desktop app: a Tauri shell whose commands are thin wrappers over pagelamp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "pagelamp_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
pagelamp-app.workspace = true
pagelamp-core.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"

[dev-dependencies]
# `test` enables tauri::test (mock runtime) for the IPC contract test.
tauri = { version = "2.11", features = ["test"] }
pagelamp-core.workspace = true
serde_json.workspace = true
tempfile.workspace = true
