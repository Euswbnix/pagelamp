[package]
name = "pagelamp-cli"
description = "The `pagelamp` command: sync your courses and serve them to your AI app over MCP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pagelamp"
path = "src/main.rs"

[dependencies]
pagelamp-core.workspace = true
pagelamp-app.workspace = true
pagelamp-mcp.workspace = true
pagelamp-extract.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
clap = { version = "4.6", features = ["derive"] }
chrono.workspace = true
serde.workspace = true
rpassword = "7"

[target.'cfg(unix)'.dependencies]
# SIGPIPE back to its default for normal commands (`pagelamp courses | head`).
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Builds the synthetic PDF bombs for the extraction-worker tests (the version pdf-extract uses).
lopdf = { version = "0.42", default-features = false }
