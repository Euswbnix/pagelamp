[workspace]
resolver = "3"
members = [
    "crates/pagelamp-core",
    "crates/pagelamp-extract",
    "crates/pagelamp-canvas",
    "crates/pagelamp-local",
    "crates/pagelamp-llm",
    "crates/pagelamp-mcp",
    "crates/pagelamp-app",
    "crates/pagelamp-ffi",
    "apps/pagelamp-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.3.0-alpha.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/Euswbnix/pagelamp"

[workspace.dependencies]
pagelamp-core = { path = "crates/pagelamp-core" }
pagelamp-extract = { path = "crates/pagelamp-extract" }
pagelamp-canvas = { path = "crates/pagelamp-canvas" }
pagelamp-local = { path = "crates/pagelamp-local" }
pagelamp-llm = { path = "crates/pagelamp-llm" }
pagelamp-mcp = { path = "crates/pagelamp-mcp" }
pagelamp-app = { path = "crates/pagelamp-app" }

anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["chrono04"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "io-std", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
regex = "1.13"
sha2 = "0.11"
hex = "0.4"
url = "2.5"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Never set `panic = "abort"`: text extraction relies on catch_unwind so one malformed file
# becomes `text_status = error` instead of killing the whole sync.
