[workspace]
resolver = "3"
members = [
    "crates/weekmark-core",
    "crates/weekmark-extract",
    "crates/weekmark-canvas",
    "crates/weekmark-local",
    "crates/weekmark-mcp",
    "crates/weekmark-app",
    "apps/weekmark-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Euswbnix/weekmark"

[workspace.dependencies]
weekmark-core = { path = "crates/weekmark-core" }
weekmark-extract = { path = "crates/weekmark-extract" }
weekmark-canvas = { path = "crates/weekmark-canvas" }
weekmark-local = { path = "crates/weekmark-local" }
weekmark-mcp = { path = "crates/weekmark-mcp" }
weekmark-app = { path = "crates/weekmark-app" }

anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2", features = ["chrono04"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "io-std", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
regex = "1.13"
sha2 = "0.11"
hex = "0.4"
url = "2.5"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Never set `panic = "abort"`: text extraction relies on catch_unwind so one malformed file
# becomes `text_status = error` instead of killing the whole sync.
