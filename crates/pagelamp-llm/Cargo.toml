[package]
name = "pagelamp-llm"
description = "PageLamp's own model calls: API-key and local-model drivers behind the course AI policy gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pagelamp-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = "0.7"
tracing.workspace = true
url.workspace = true
toml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Validates JSON answers locally. No default features: they fetch remote `$ref`s and bring a
# second TLS stack.
jsonschema = { version = "0.58", default-features = false }

[dev-dependencies]
pagelamp-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["net", "io-util"] }
wiremock = "0.6"
