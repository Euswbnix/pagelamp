[package]
name = "pagelamp-extract"
description = "Text extraction (PDF, PPTX, DOCX, notebooks, HTML, text) and chunking for PageLamp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
pdf-extract = "0.12"
# Size-capped inflate for the PDF bomb check (already used by `zip` and `lopdf`).
flate2 = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
html2text = "0.17"
# The link scan (`links`): the tokenizer html2text already brings in, at the same version.
html5ever = "0.39"

[target.'cfg(unix)'.dependencies]
# The extraction worker's rlimits, CPU clock and exit.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The extraction worker's Job Object, CPU clock, crash-dialog mode and CREATE_NO_WINDOW
# (Console: the debug-build check that the worker has no console window).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
# Builds tiny PDF fixtures in tests. Same version pdf-extract already uses; no extra features.
lopdf = { version = "0.42", default-features = false }
