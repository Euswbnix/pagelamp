[package]
name = "pagelamp-app"
description = "PageLamp application services: the single facade used by both the CLI and the desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pagelamp-core.workspace = true
pagelamp-extract.workspace = true
pagelamp-canvas.workspace = true
pagelamp-local.workspace = true
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
# Compare download directory names the way APFS/NTFS do (already used by pdf-extract).
unicode-normalization = "0.1"
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# statfs: is the disk image PageLamp runs from a read-only volume?
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"
tokio.workspace = true
