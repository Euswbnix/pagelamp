session = "20269"
campus = 5
first_class = "2026-09-08"
last_class = "2026-12-08"
exams_start = "2026-12-10"
exams_end = "2026-12-22"
breaks = [
    { kind = "holiday", start = "2026-10-12", end = "2026-10-12" },
