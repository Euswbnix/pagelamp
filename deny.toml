# cargo-deny configuration. CI runs `cargo deny check licenses` (docs/ARCHITECTURE.md §7):
# every dependency must be compatible with shipping Weekmark under Apache-2.0.
# Copyleft licences (GPL, AGPL, LGPL, SSPL) and source-available ones (BUSL, FSL, Elastic) are
# not allowed. MPL-2.0 is allowed: its copyleft is file-level and we don't modify those files.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
